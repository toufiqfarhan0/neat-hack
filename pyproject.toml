[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ovio"
version = "0.1.0"
description = "Autonomous AP & Treasury Recovery Agent powered by Neatlogs, Entire & cfo.ai"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team Dot" }]
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "neatlogs>=1.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0"
]

[project.scripts]
ovio = "ovio_cli:main"

[tool.setuptools]
py-modules = ["ovio_cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*"]

